---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: aura360-os
# description will be included in the image's metadata
description: Aura 360 OS — immutable creator workstation (design, video, audio, code) built on Bazzite DX.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx-nvidia
image-version: stable

# module configuration, executed in order
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* into the image root (/)

  - type: systemd
    system:
      enabled:
        - aura-performance.service

  - type: dnf
    install:
      packages:
        - kernel-tools # provides cpupower (CPU governor for low-latency audio)

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.kde.krita
          - org.gimp.GIMP
          - org.inkscape.Inkscape
          - org.blender.Blender
          - org.kde.kdenlive
          - org.ardour.Ardour
          - org.audacityteam.Audacity
          - org.darktable.Darktable
          - com.rawtherapee.RawTherapee
          - net.scribus.Scribus
          - com.usebottles.bottles
      - scope: user

  - type: script
    snippets:
      - plymouth-set-default-theme -R aura360
      - sed -i 's/^NAME=.*/NAME="Aura 360 OS"/' /usr/lib/os-release
      - sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Aura 360 OS"/' /usr/lib/os-release
      - sed -i 's/^LOGO=.*/LOGO=aura360-logo/' /usr/lib/os-release
      - grep -q '^LOGO=' /usr/lib/os-release || echo 'LOGO=aura360-logo' >> /usr/lib/os-release
      - sed -i 's/^DEFAULT_HOSTNAME=.*/DEFAULT_HOSTNAME="aura360"/' /usr/lib/os-release
