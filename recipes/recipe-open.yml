---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# AMD/Intel variant (no NVIDIA drivers; uses Mesa/open drivers)
name: aura360-os-open
description: Aura 360 OS — immutable creator workstation (AMD/Intel GPU variant) built on Bazzite DX.

base-image: ghcr.io/ublue-os/bazzite-dx
image-version: stable

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: systemd
    system:
      enabled:
        - aura-performance.service

  - type: dnf
    install:
      packages:
        - kernel-tools
        - plymouth-plugin-script

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.kde.krita
          - org.gimp.GIMP
          - org.inkscape.Inkscape
          - org.blender.Blender
          - org.kde.kdenlive
          - org.ardour.Ardour
          - org.audacityteam.Audacity
          - org.darktable.Darktable
          - com.rawtherapee.RawTherapee
          - net.scribus.Scribus
          - com.usebottles.bottles
      - scope: user

  - type: script
    snippets:
      - plymouth-set-default-theme -R aura360
      - sed -i 's/^NAME=.*/NAME="Aura 360 OS"/' /usr/lib/os-release
      - sed -i 's/^PRETTY_NAME=.*/PRETTY_NAME="Aura 360 OS"/' /usr/lib/os-release
      - sed -i 's/^LOGO=.*/LOGO=aura360-logo/' /usr/lib/os-release
      - grep -q '^LOGO=' /usr/lib/os-release || echo 'LOGO=aura360-logo' >> /usr/lib/os-release
      - sed -i 's/^DEFAULT_HOSTNAME=.*/DEFAULT_HOSTNAME="aura360"/' /usr/lib/os-release
